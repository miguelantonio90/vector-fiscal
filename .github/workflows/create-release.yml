name: Crear release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear siguiente release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            NEXT="v1.0.0"
            RANGE=""
          else
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
            RANGE="${LATEST}..HEAD"
          fi

          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "El tag $NEXT ya existe. Nada que hacer."
            exit 0
          fi

          if [ -n "$RANGE" ]; then
            NOTES=$(git log "$RANGE" --pretty=format:'- %s' --no-merges)
          else
            NOTES=$(git log -10 --pretty=format:'- %s' --no-merges)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Sin cambios listados desde el release anterior"
          fi

          BODY=$(cat <<EOF
          ## MiONAT ${NEXT}

          Release generado automáticamente desde \`main\`.

          ### Cambios
          ${NOTES}
          EOF
          )

          # Quitar sangría accidental del heredoc
          BODY=$(printf '%s\n' "$BODY" | sed 's/^          //')

          gh release create "$NEXT" \
            --target main \
            --title "MiONAT ${NEXT}" \
            --notes "$BODY"

          echo "Release creado: $NEXT"
