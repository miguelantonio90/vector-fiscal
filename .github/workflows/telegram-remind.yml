name: Recordatorio Telegram diario

on:
  schedule:
    # 13:00 UTC ≈ 08:00 Cuba (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorios
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secret CRON_SECRET"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            https://mionat-api.onrender.com/api/alerts/telegram-remind
